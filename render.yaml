services:
  - type: web
    name: joshi-commerce-academy
    runtime: node
    plan: free
    buildCommand: npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: EMAIL_FROM_NAME
        value: Joshi's Commerce Academy
      - key: MAIL_SEND_DELAY_MS
        value: "1500"
      - key: REMINDER_CRON
        value: "0 8 * * *"
